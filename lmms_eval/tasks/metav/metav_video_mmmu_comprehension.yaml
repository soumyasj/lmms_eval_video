# Meta-Video (metav), the video_mmmu_comprehension items; generated by gen_yamls.py
task: metav_video_mmmu_comprehension
dataset_path: soumyasj/Meta-Video
dataset_name: meta_v
dataset_kwargs:
  token: True
  video: True
  cache_dir: meta_video
  create_link: True
test_split: test
output_type: generate_until
doc_to_visual: !function utils.metav_doc_to_visual
process_docs: !function utils.process_docs_video_mmmu_comprehension
doc_to_text: !function utils.doc_to_text_video_mmmu_comprehension
doc_to_target: !function utils.videommmu_doc_to_answer
process_results: !function utils.videommmu_process_results
metric_list:
  - metric: mmmu_acc
    aggregation: !function utils.videommmu_aggregate_results
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 1024
lmms_eval_specific_kwargs:
  default:
    prompt_variant: default
  qwen3_vl:
    prompt_variant: qwen3_vl
metadata:
  - version: 0.1
