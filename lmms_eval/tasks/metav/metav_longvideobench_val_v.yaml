# Meta-Video (metav), the longvideobench_val_v items; generated by gen_yamls.py
task: metav_longvideobench_val_v
dataset_path: soumyasj/Meta-Video
dataset_name: meta_v
dataset_kwargs:
  token: True
  video: True
  cache_dir: meta_video
  create_link: True
test_split: test
output_type: generate_until
doc_to_visual: !function utils.metav_doc_to_visual
process_docs: !function utils.process_docs_longvideobench_val_v
doc_to_text: !function utils.doc_to_text_longvideobench_val_v
doc_to_target: "correct_choice"
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: False
process_results: !function utils.longvideobench_process_results
metric_list:
  - metric: lvb_acc
    aggregation: !function utils.longvideobench_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    prompt_variant: default
  qwen3_vl:
    prompt_variant: qwen3_vl
metadata:
  - version: 0.1
