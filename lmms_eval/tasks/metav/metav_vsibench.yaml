# Meta-Video (metav), the vsibench items; generated by gen_yamls.py
task: metav_vsibench
dataset_path: soumyasj/Meta-Video
dataset_name: meta_v
dataset_kwargs:
  token: True
  video: True
  cache_dir: meta_video
  create_link: True
test_split: test
output_type: generate_until
doc_to_visual: !function utils.metav_doc_to_visual
process_docs: !function utils.process_docs_vsibench
doc_to_text: !function utils.doc_to_text_vsibench
doc_to_target: "ground_truth"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.vsibench_process_results
metric_list:
  - metric: vsibench_overall
    aggregation: !function utils.vsibench_aggregate_overall
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    prompt_variant: default
  qwen3_vl:
    prompt_variant: qwen3_vl
metadata:
  - version: 0.1
