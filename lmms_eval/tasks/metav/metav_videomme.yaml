# Meta-VideoBench (metav) slice of videomme; generated by gen_yamls.py
task: metav_videomme
process_docs: !function utils.process_docs_videomme
dataset_path: lmms-lab/Video-MME
dataset_kwargs:
  cache_dir: videomme
  video: True
test_split: test
output_type: generate_until
cluster_key: videoID
doc_to_visual: !function utils.videomme_doc_to_visual
doc_to_text: !function utils.doc_to_text_videomme
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.videomme_process_results
metric_list:
  - metric: videomme_perception_score
    aggregation: !function utils.videomme_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    prompt_variant: default
  qwen3_vl:
    prompt_variant: qwen3_vl
metadata:
  - version: 0.0
