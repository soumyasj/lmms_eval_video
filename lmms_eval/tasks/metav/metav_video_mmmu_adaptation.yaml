# Meta-VideoBench (metav) slice of video_mmmu_adaptation; generated by gen_yamls.py
task: metav_video_mmmu_adaptation
process_docs: !function utils.process_docs_video_mmmu_adaptation
dataset_path: lmms-lab/VideoMMMU
dataset_name: "Adaptation"
dataset_kwargs:
  token: True
  video: True
  cache_dir: video_mmmu
test_split: test
output_type: generate_until
doc_to_visual: !function utils.videommmu_doc_to_visual
doc_to_text: !function utils.doc_to_text_video_mmmu_adaptation
doc_to_target: !function utils.videommmu_doc_to_answer
process_results: !function utils.videommmu_process_results
metric_list:
  - metric: mmmu_acc
    aggregation: !function utils.videommmu_aggregate_results
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 1024
lmms_eval_specific_kwargs:
  default:
    prompt_variant: default
  qwen3_vl:
    prompt_variant: qwen3_vl
metadata:
  - version: 0.0
